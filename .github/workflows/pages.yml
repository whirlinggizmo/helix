# The examples' site, deployed to GitHub Pages: every example built for the web (tools/pages.py), a thumbnail of each and the index. Daily,
# after main's checks, and on demand (gh workflow run pages, or the Actions tab), not on every push: the build and the thumbnails take some
# 15 minutes, which pushes during the ATL Gamedevs Jam's preparation shouldn't wait on.
name: pages

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

# One deploy at a time; a newer one waits rather than cancelling a deploy half done.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    name: the examples' site (GitHub Pages)
    # Every example built for the web, a thumbnail of each, and the index (tools/pages.py), deployed as the repository's Pages site.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7
      - name: Python and Node packages, and Chromium
        run: |
          python -m pip install PyYAML==6.0.1
          npm install --prefix build/tools terser@5.44.1 playwright@1.64.0 pngjs@7.0.0
          (cd build/tools && npx playwright install --with-deps chromium)
          echo "CHROME=$(node -e "console.log(require('./build/tools/node_modules/playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: The site
        run: python tools/pages.py --browser "$CHROME"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/js/release-webgl2/site
      - id: deploy
        uses: actions/deploy-pages@v4

