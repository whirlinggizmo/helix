# HeliX's CI: the checks a milestone ends with, on Linux, Windows and macOS (docs/ROADMAP.md, milestone 7). After wgrender-c's and libwgf's:
#
# - On every push and pull request (not for docs alone), on each system: the tool, package and unit tests, Trig's bits on the interpreter,
#   Node and hxcpp, and (pull requests only until after the jam, 2026-10-25) an example's native build, since only a native build compiles
#   the adapters' C (wgrender-c's "one example links").
#   Linux also type-checks every example on both targets and checks formatting and doc comments.
# - Daily and on demand, on Linux: the platform services in Chrome and natively, both autopilots, natively in a private X display, and
#   the browser asset cache across visits (tools/check_cache.py);
#   on Windows and macOS, every example's native build under each backend, the examples split among four runners a system; on macOS,
#   both autopilots under SDL_GPU through Metal, in a window on the runner's virtual GPU.
# - Builds are named <platform>-<config>-<backend> (docs/CONVENTIONS.md, Build), given to the tools as <config>-<backend>, the platform the
#   runner's: release-sokol-gl, release-sdl3-gl and release-sdl3-gpu natively, release-webgl2 in the browser; their results in out/.
# - On every push to main: the examples' site (tools/pages.py), deployed to GitHub Pages.
# - Windows' and macOS' runners have no GPU for sokol's GL 4.1, so no GL window opens there (libwgf's finding); a window on Windows is
#   tools/remote_windows.py's, on a machine with one. Linux runs SDL_GPU's Vulkan through Mesa's software driver, lavapipe.
# - The native backends, sokol-gl, sdl3-gl and sdl3-gpu (docs/ROADMAP.md, milestone 8); SDL_GPU's shaders need glslang and
#   SPIRV-Cross (src/helix/tools/shader/GpuShaders.hx, in the user's cache, cached): SDL 3.4.18 is tools/sdl3.py's, built from its source on
#   Linux (CMake, the runner's) and the official release on Windows and macOS, kept in build/deps and cached.
#
# Haxe 4.3.7; hxcpp 4.3.2 and the formatter in the repository's haxelib (build/haxelib), cached, a cache miss fetching them with retries
# (tools/pins.py); sokol-shdc fetched and checked by src/helix/tools/shader/Shdc.hx. A newer push cancels the run in progress.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  schedule:
    - cron: "41 9 * * *"
  workflow_dispatch:

# What SDL's source build needs on Linux to have its X11, Wayland and audio parts: SDL loads their libraries at run time.
env:
  SDL3_BUILD: libxext-dev libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev libdrm-dev libgbm-dev libegl-dev

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 libx11-dev libxrandr-dev libxi-dev libxcursor-dev libgl-dev libasound2-dev $SDL3_BUILD
      - name: System packages (macOS)
        if: runner.os == 'macOS'
        run: brew install libsndfile
      - name: Python packages
        run: python -m pip install PyYAML==6.0.1
      - uses: actions/cache@v4
        with:
          path: build/haxelib
          key: haxelib-${{ runner.os }}-${{ hashFiles('dependencies.json') }}
      - uses: actions/cache@v4
        with:
          path: build/deps
          key: deps-${{ runner.os }}-${{ hashFiles('dependencies.json') }}
      - uses: actions/cache@v4
        with:
          # The shader tool's (src/helix/tools/shader/): sokol-shdc, glslang and SPIRV-Cross built, in the user's cache on each system.
          path: |
            ~/.cache/helix/tools
            ~/Library/Caches/helix/tools
            ~/AppData/Local/helix/tools
          key: helix-tools-${{ runner.os }}-${{ hashFiles('dependencies.json', 'src/helix/src/helix/tools/shader/Shdc.hx') }}
      - name: Tool, package and unit tests; Trig's bits on every target
        run: python helix.py test --native
      - name: An example's native build under each backend (the adapters' C), and in debug
        # Left out of pushes until after the ATL Gamedevs Jam (2026-10-25), so a push runs in about 12 minutes, not 18; pull requests, the
        # daily run and a run on demand build it, and the native service tests above still compile the adapters' C on every push.
        if: github.event_name != 'push'
        run: |
          python tools/example.py asteroids build release-sokol-gl
          python tools/example.py asteroids build release-sdl3-gl
          python tools/example.py asteroids build release-sdl3-gpu
          python tools/example.py asteroids build debug-sokol-gl
      - name: Every example type-checked on both targets
        if: runner.os == 'Linux'
        run: python tools/check_types.py
      - name: Formatting and doc comments
        if: runner.os == 'Linux'
        run: |
          python tools/format.py --check
          python tools/check_docs.py

  examples:
    name: every example's native build (${{ matrix.os }}, group ${{ matrix.group }}/4, daily)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
        group: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7
      - name: System packages (macOS)
        if: runner.os == 'macOS'
        run: brew install libsndfile
      - name: Python packages
        run: python -m pip install PyYAML==6.0.1
      - uses: actions/cache@v4
        with:
          path: build/haxelib
          key: haxelib-${{ runner.os }}-${{ hashFiles('dependencies.json') }}
      - uses: actions/cache@v4
        with:
          path: build/deps
          key: deps-${{ runner.os }}-${{ hashFiles('dependencies.json') }}
      - uses: actions/cache@v4
        with:
          # The shader tool's (src/helix/tools/shader/): sokol-shdc, glslang and SPIRV-Cross built, in the user's cache on each system.
          path: |
            ~/.cache/helix/tools
            ~/Library/Caches/helix/tools
            ~/AppData/Local/helix/tools
          key: helix-tools-${{ runner.os }}-${{ hashFiles('dependencies.json', 'src/helix/src/helix/tools/shader/Shdc.hx') }}
      - name: A quarter of the examples, natively under each backend
        run: |
          python tools/example.py all build release-sokol-gl --group ${{ matrix.group }}/4
          python tools/example.py all build release-sdl3-gl --group ${{ matrix.group }}/4
          python tools/example.py all build release-sdl3-gpu --group ${{ matrix.group }}/4

  full:
    name: services and autopilots (Linux, daily)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 libx11-dev libxrandr-dev libxi-dev libxcursor-dev libgl-dev libasound2-dev xvfb openbox x11-xserver-utils libgl1-mesa-dri mesa-vulkan-drivers $SDL3_BUILD
      - name: Python and Node packages, and Chromium
        run: |
          python -m pip install PyYAML==6.0.1
          npm install --prefix build/tools terser@5.44.1 playwright@1.64.0 pngjs@7.0.0
          (cd build/tools && npx playwright install --with-deps chromium)
          echo "CHROME=$(node -e "console.log(require('./build/tools/node_modules/playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: build/haxelib
          key: haxelib-${{ runner.os }}-${{ hashFiles('dependencies.json') }}
      - uses: actions/cache@v4
        with:
          path: build/deps
          key: deps-${{ runner.os }}-${{ hashFiles('dependencies.json') }}
      - uses: actions/cache@v4
        with:
          # The shader tool's (src/helix/tools/shader/): sokol-shdc, glslang and SPIRV-Cross built, in the user's cache on each system.
          path: |
            ~/.cache/helix/tools
            ~/Library/Caches/helix/tools
            ~/AppData/Local/helix/tools
          key: helix-tools-${{ runner.os }}-${{ hashFiles('dependencies.json', 'src/helix/src/helix/tools/shader/Shdc.hx') }}
      - name: Platform services, in Chrome and natively, sokol's and SDL3's
        env:
          HELIX_AUDIO: "0"
        # The runner has no sound card: ALSA's default device is made a null one, so sokol_audio opens and its mixer runs.
        run: |
          printf 'pcm.!default { type null }\n' > ~/.asoundrc
          python helix.py services --browser "$CHROME" --native release-sokol-gl
          python helix.py services --browser "$CHROME" --native release-sdl3-gl
      - name: The autopilots, the same final game in Chrome and natively under sokol-gl and sdl3-gl
        env:
          HELIX_AUDIO: "0"
        run: |
          python tools/example.py asteroids autopilot release-sokol-gl --browser "$CHROME"
          python tools/example.py blocks autopilot release-sokol-gl --browser "$CHROME"
          python tools/example.py asteroids autopilot release-sdl3-gl --browser "$CHROME"
          python tools/example.py blocks autopilot release-sdl3-gl --browser "$CHROME"
      - name: The browser asset cache across visits (revalidation and manifests)
        run: |
          python tools/example.py sprite2d build release-webgl2
          python tools/example.py sprite2d build release-sokol-gl
          python tools/check_cache.py --native --browser "$CHROME"
      - name: The autopilots under SDL_GPU, on Vulkan through Mesa's software driver (lavapipe)
        env:
          HELIX_AUDIO: "0"
          SDL_GPU_DRIVER: vulkan
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          python tools/example.py asteroids autopilot release-sdl3-gpu --browser "$CHROME"
          python tools/example.py blocks autopilot release-sdl3-gpu --browser "$CHROME"
      - name: The autopilots' results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-results
          path: build/results
          if-no-files-found: ignore

  pages:
    name: the examples' site (GitHub Pages)
    # Every example built for the web, a thumbnail of each, and the index (tools/pages.py), deployed as the repository's Pages site.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7
      - name: Python and Node packages, and Chromium
        run: |
          python -m pip install PyYAML==6.0.1
          npm install --prefix build/tools terser@5.44.1 playwright@1.64.0 pngjs@7.0.0
          (cd build/tools && npx playwright install --with-deps chromium)
          echo "CHROME=$(node -e "console.log(require('./build/tools/node_modules/playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: The site
        run: python tools/pages.py --browser "$CHROME"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/js/release-webgl2/site
      - id: deploy
        uses: actions/deploy-pages@v4

  mac-gpu:
    name: SDL_GPU on CI's Mac (Metal, daily)
    # Both autopilots under sdl3-gpu, in a window SDL_GPU draws in through Metal on the runner's virtual GPU.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7
      - name: System packages
        run: brew install libsndfile
      - name: Python and Node packages, and Chromium
        run: |
          python -m pip install PyYAML==6.0.1
          npm install --prefix build/tools terser@5.44.1 playwright@1.64.0 pngjs@7.0.0
          (cd build/tools && npx playwright install chromium)
          echo "CHROME=$(node -e "console.log(require('./build/tools/node_modules/playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: build/haxelib
          key: haxelib-${{ runner.os }}-${{ hashFiles('dependencies.json') }}
      - uses: actions/cache@v4
        with:
          path: build/deps
          key: deps-${{ runner.os }}-${{ hashFiles('dependencies.json') }}
      - uses: actions/cache@v4
        with:
          # The shader tool's (src/helix/tools/shader/): sokol-shdc, glslang and SPIRV-Cross built, in the user's cache on each system.
          path: |
            ~/.cache/helix/tools
            ~/Library/Caches/helix/tools
            ~/AppData/Local/helix/tools
          key: helix-tools-${{ runner.os }}-${{ hashFiles('dependencies.json', 'src/helix/src/helix/tools/shader/Shdc.hx') }}
      - name: The autopilots under SDL_GPU (Metal)
        env:
          HELIX_AUDIO: "0"
        run: |
          python tools/example.py asteroids autopilot release-sdl3-gpu --browser "$CHROME"
          python tools/example.py blocks autopilot release-sdl3-gpu --browser "$CHROME"
      - name: The autopilots' results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-gpu-results
          path: build/results
          if-no-files-found: ignore
