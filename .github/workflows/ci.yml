# HeliX's CI: the checks a milestone ends with, on Linux, Windows and macOS (docs/ROADMAP.md, milestone 7). After wgrender-c's and libwgf's:
#
# - On every push and pull request (not for docs alone), on each system: the tool, package and unit tests, Trig's bits on the interpreter,
#   Node and hxcpp, and an example's native build, since only a native build compiles the adapters' C (wgrender-c's "one example links").
#   Linux also type-checks every example on both targets and checks formatting and doc comments.
# - Daily and on demand, on Linux: the platform services in Chrome and natively, and both autopilots, natively in a private X display;
#   on Windows and macOS, every example's native build.
# - Windows' and macOS' runners have no GPU for sokol's GL 4.1, so nothing opens a window there (libwgf's finding); a window on Windows is
#   tools/remote_windows.py's, on a machine with one.
# - Both native profiles, sokol's and SDL3's (docs/ROADMAP.md, milestone 8): SDL 3.4.18 is tools/sdl3.py's, built from its source on Linux
#   (CMake, the runner's) and the official release on Windows and macOS, kept in build/deps and cached.
#
# Haxe 4.3.7; hxcpp 4.3.2 and the formatter in the repository's haxelib (build/haxelib), cached, a cache miss fetching them with retries
# (tools/pins.py); sokol-shdc fetched and checked by tools/shdc.py. A newer push cancels the run in progress.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  schedule:
    - cron: "41 9 * * *"
  workflow_dispatch:

# What SDL's source build needs on Linux to have its X11, Wayland and audio parts: SDL loads their libraries at run time.
env:
  SDL3_BUILD: libxext-dev libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev libdrm-dev libgbm-dev libegl-dev

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 libx11-dev libxrandr-dev libxi-dev libxcursor-dev libgl-dev libasound2-dev $SDL3_BUILD
      - name: System packages (macOS)
        if: runner.os == 'macOS'
        # Homebrew's ffmpeg has no Vorbis encoder; ffmpeg-full has, keg-only, so its bin goes first on PATH.
        run: |
          brew install ffmpeg-full libsndfile
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: System packages (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Python packages
        run: python -m pip install PyYAML==6.0.1
      - uses: actions/cache@v4
        with:
          path: build/haxelib
          key: haxelib-${{ runner.os }}-${{ hashFiles('dependencies.json') }}
      - uses: actions/cache@v4
        with:
          path: build/deps
          key: deps-${{ runner.os }}-${{ hashFiles('dependencies.json') }}
      - name: Tool, package and unit tests; Trig's bits on every target
        run: python helix.py test --native
      - name: An example's native build under each profile (the adapters' C)
        run: |
          python tools/example.py asteroids build native
          python tools/example.py asteroids build native-sdl3
      - name: Every example type-checked on both targets
        if: runner.os == 'Linux'
        run: python tools/typecheck.py
      - name: Formatting and doc comments
        if: runner.os == 'Linux'
        run: |
          python tools/format.py --check
          python tools/doccheck.py

  examples:
    name: every example's native build (${{ matrix.os }}, daily)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7
      - name: System packages (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full libsndfile
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: System packages (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Python packages
        run: python -m pip install PyYAML==6.0.1
      - uses: actions/cache@v4
        with:
          path: build/haxelib
          key: haxelib-${{ runner.os }}-${{ hashFiles('dependencies.json') }}
      - uses: actions/cache@v4
        with:
          path: build/deps
          key: deps-${{ runner.os }}-${{ hashFiles('dependencies.json') }}
      - name: Every example, natively under each profile
        run: |
          python tools/example.py all build native
          python tools/example.py all build native-sdl3

  full:
    name: services and autopilots (Linux, daily)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 libx11-dev libxrandr-dev libxi-dev libxcursor-dev libgl-dev libasound2-dev xvfb openbox x11-xserver-utils libgl1-mesa-dri $SDL3_BUILD
      - name: Python and Node packages, and Chromium
        run: |
          python -m pip install PyYAML==6.0.1
          npm install --prefix build/tools terser@5.44.1 playwright@1.64.0 pngjs@7.0.0
          (cd build/tools && npx playwright install --with-deps chromium)
          echo "CHROME=$(node -e "console.log(require('./build/tools/node_modules/playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: build/haxelib
          key: haxelib-${{ runner.os }}-${{ hashFiles('dependencies.json') }}
      - uses: actions/cache@v4
        with:
          path: build/deps
          key: deps-${{ runner.os }}-${{ hashFiles('dependencies.json') }}
      - name: Platform services, in Chrome and natively under each profile
        env:
          HELIX_AUDIO: "0"
        run: |
          python helix.py services --browser "$CHROME" --native
          python helix.py services --browser "$CHROME" --native --native-profile sdl3
      - name: The autopilots, the same final game in Chrome and natively under each profile
        env:
          HELIX_AUDIO: "0"
        run: |
          python tools/example.py asteroids autopilot --browser "$CHROME"
          python tools/example.py blocks autopilot --browser "$CHROME"
          python tools/example.py asteroids autopilot native-sdl3 --browser "$CHROME"
          python tools/example.py blocks autopilot native-sdl3 --browser "$CHROME"
      - name: The autopilots' results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-results
          path: build/results
          if-no-files-found: ignore
