# CI: the libraries' checks on Linux, Windows and macOS.
#
# - On every push and pull request (not for docs alone), on each system: the tools' checks, each library's tests on the interpreter and
#   Node, Trig's bits on the interpreter, Node and hxcpp, and on Linux the platform's C tests (they build with cc and SDL3); Linux also
#   type-checks every entry point on both targets and checks formatting and doc comments.
# - Daily and on demand, on Linux: the platform's examples and graphics tests on the GPU (tools/platform_checks.py), natively in a
#   private X display (SDL_GPU's Vulkan through Mesa's software driver, lavapipe) and in a headless Chromium.
# - Windows' and macOS' runners have no GPU for GL 4.1, so no window opens there; a window on Windows is tools/remote_windows.py's, on a
#   machine with one.
# - SDL 3.4.18 is tools/sdl3.py's, built from its source on Linux (CMake, the runner's) and the official release on Windows and macOS,
#   kept in build/deps and cached. helix-platform's shader compiler fetches glslang and SPIRV-Cross into the user's cache, cached.
#
# Haxe 4.3.7; hxcpp 4.3.2 and the formatter in the repository's haxelib (build/haxelib), cached, a cache miss fetching them with retries
# (tools/pins.py). A newer push cancels the run in progress.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  schedule:
    - cron: "41 9 * * *"
  workflow_dispatch:

# What SDL's source build needs on Linux to have its X11, Wayland and audio parts: SDL loads their libraries at run time.
env:
  SDL3_BUILD: libxext-dev libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev libdrm-dev libgbm-dev libegl-dev

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxi-dev libxcursor-dev libgl-dev libasound2-dev $SDL3_BUILD
      - uses: actions/cache@v4
        with:
          path: build/haxelib
          key: haxelib-${{ runner.os }}-${{ hashFiles('dependencies.json') }}
      - uses: actions/cache@v4
        with:
          path: build/deps
          key: deps-${{ runner.os }}-${{ hashFiles('dependencies.json') }}
      - uses: actions/cache@v4
        with:
          # helix-platform's shader compiler's: glslang fetched and SPIRV-Cross built, in the user's cache on each system.
          path: |
            ~/.cache/helix/tools
            ~/Library/Caches/helix/tools
            ~/AppData/Local/helix/tools
          key: helix-tools-${{ runner.os }}-${{ hashFiles('platform/src/helix/platform/tools/ShaderTools.hx') }}
      - name: The tools' checks, the libraries' tests, Trig's bits on every target, the platform's C tests (Linux)
        env:
          SDL_AUDIO_DRIVER: dummy
        run: python helix.py test --native
      - name: Every entry point type-checked on both targets
        if: runner.os == 'Linux'
        run: python tools/check_types.py
      - name: Formatting and doc comments
        if: runner.os == 'Linux'
        run: |
          python tools/format.py --check
          python tools/check_docs.py

  gpu:
    name: the platform on the GPU (Linux, daily)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxi-dev libxcursor-dev libgl-dev libasound2-dev xvfb openbox x11-xserver-utils libgl1-mesa-dri mesa-vulkan-drivers $SDL3_BUILD
      - name: Node packages and Chromium
        run: |
          npm install --prefix build/tools playwright@1.64.0
          (cd build/tools && npx playwright install --with-deps chromium)
          echo "CHROME=$(node -e "console.log(require('./build/tools/node_modules/playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: build/haxelib
          key: haxelib-${{ runner.os }}-${{ hashFiles('dependencies.json') }}
      - uses: actions/cache@v4
        with:
          path: build/deps
          key: deps-${{ runner.os }}-${{ hashFiles('dependencies.json') }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/helix/tools
            ~/Library/Caches/helix/tools
            ~/AppData/Local/helix/tools
          key: helix-tools-${{ runner.os }}-${{ hashFiles('platform/src/helix/platform/tools/ShaderTools.hx') }}
      - name: The platform's examples and graphics tests, natively (GL, and SDL_GPU on lavapipe) and in Chromium
        env:
          SDL_AUDIO_DRIVER: dummy
          SDL_GPU_DRIVER: vulkan
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: python tools/platform_checks.py --browser "$CHROME"
      - name: The checks' screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-results
          path: build/results
          if-no-files-found: ignore
